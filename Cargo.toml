[package]
name = "infra"
version = "0.1.0"
edition = "2024"
description = "predictable infrastructure configuration and reconciliation cli"
license = "MIT"
repository = "https://github.com/0x0sky/infraCLI"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"
