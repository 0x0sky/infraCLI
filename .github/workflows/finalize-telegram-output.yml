name: finalize telegram output

on:
  push:
    branches:
      - agent/containerized-service-monitor

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/containerized-service-monitor
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Model output as Telegram bot
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          agent = Path("src/agent.rs")
          text = agent.read_text()
          replacements = {
              "InfraBotOutput": "TelegramOutput",
              'Some("infrabot")': 'Some("telegram")',
              "driver must be infrabot": "driver must be telegram",
              'driver = "infrabot"': 'driver = "telegram"',
              "exactly one infraBot output": "exactly one Telegram output",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected agent token: {old}")
              text = text.replace(old, new)
          agent.write_text(text)

          for filename in ["README.md", "examples/infra-agent.infra"]:
              path = Path(filename)
              content = path.read_text()
              if 'driver = "infrabot"' not in content:
                  raise SystemExit(f"missing output driver in {filename}")
              content = content.replace('driver = "infrabot"', 'driver = "telegram"')
              content = content.replace(
                  "exactly one infraBot output",
                  "exactly one Telegram output",
              )
              path.write_text(content)

          readme = Path("README.md")
          content = readme.read_text()
          content = content.replace(
              "`output.fields` is the projection contract sent to infraBot.",
              "`output.fields` is the projection rendered by the named Telegram bot through infraBot.",
          )
          content = content.replace(
              "The output block name is an adapter ID.",
              "The output block name is the Telegram bot username.",
          )
          readme.write_text(content)
          PY
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: docker build --file Dockerfile.agent --tag infra-agent:telegram .
      - name: Commit Telegram output contract
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/agent.rs README.md examples/infra-agent.infra
          git commit -m "Model output as Telegram bot"
          git push origin HEAD:agent/containerized-service-monitor
